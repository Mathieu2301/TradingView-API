# Project: https://github.com/Mathieu2301/TradingView-API
# Package: https://www.npmjs.com/package/@mathieuc/tradingview
name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'

jobs:
  Tests:
    runs-on: ubuntu-latest

    strategy:
      # TradingView authenticated tests use the same account/session secrets.
      # Running every Node matrix job at once makes the external websocket tests flaky.
      max-parallel: 1
      matrix:
        node-version: [14.x, 18.x, 19.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test -- --run
      env:
        SESSION: ${{ secrets.TW_SESSION }}
        SIGNATURE: ${{ secrets.TW_SIGNATURE }}

  Agent-API:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build:agent
    - run: npm run lint:agent
    - run: npm test -- --run tests/agent.test.ts
    - run: npm pack --dry-run
