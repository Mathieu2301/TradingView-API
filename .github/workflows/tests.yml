# Project: https://github.com/Mathieu2301/TradingView-API
# Package: https://www.npmjs.com/package/@mathieuc/tradingview
name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'

jobs:
  # Deterministic checks: no network access to TradingView is needed.
  Node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm test
    - run: npm run build
    - run: npm run smoke

  Bun:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - uses: oven-sh/setup-bun@v2
    - run: npm ci
    - run: npm run test:bun
    - run: npm run build
    # The smoke test imports the packed tarball under Node and Bun.
    - run: npm run smoke

  # Talks to TradingView: nightly or manual only, never blocking.
  Live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run test:live
      env:
        SESSION: ${{ secrets.TW_SESSION }}
        SIGNATURE: ${{ secrets.TW_SIGNATURE }}
